<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <title>生日大奖赛</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">GP</span><div><b>生日大奖赛</b><small>PIXEL GRAND PRIX</small></div></div>
      <div class="race-tag"><i></i> ROUND 01</div>
    </header>
    <section class="stage" aria-label="像素赛车游戏区域">
      <canvas id="game" width="480" height="800" aria-label="用方向键或拖动赛车进行游戏"></canvas>
      <div class="hud" id="hud" aria-live="polite">
        <div class="hud-card"><small>金币</small><b><span class="coin-icon">◆</span> <span id="coinCount">0</span><em> / 5</em></b></div>
        <div class="hud-card damage-card"><div><small>碰撞</small><b id="damageCount">♥ ♥</b></div><div class="reaction"><small>起跑反应</small><b id="reactionTime">--- ms</b></div></div>
      </div>
      <div class="overlay" id="overlay">
        <div class="loading-backdrop" id="loadingBackdrop"></div>
        <div class="loading-card" id="loadingCard" role="status" aria-live="polite">
          <div class="eyebrow">SCUDERIA PIXEL · SYSTEM CHECK</div>
          <img class="loading-car" src="assets/race-car.png" alt="" />
          <h1>车队准备中</h1>
          <p id="loadingStatus">正在检查赛车与赛道素材…</p>
          <div class="loading-meter"><div class="loading-fill" id="loadingFill"></div></div>
          <div class="loading-meta"><span id="loadingPercent">0%</span><span id="loadingCount">0 / 12</span></div>
          <button class="loading-retry hidden" id="loadingRetry" type="button">重试加载 <span>↻</span></button>
        </div>
        <div class="start-card hidden" id="startCard">
          <div class="eyebrow">ARCADE RACING · 8-BIT</div>
          <h1>生日大奖赛</h1>
          <p>躲开轮胎，收集 5 枚金币<br />冲过终点，登上冠军领奖台</p>
          <div class="light-rig" id="lightRig" aria-label="起步信号灯">
            <img id="signalImage" src="assets/start-light-0.png" alt="五盏红色起步灯" />
          </div>
          <button id="startButton">点火出发 <span>▶</span></button>
          <div class="controls-hint" id="startHint">点击“点火出发”开始灯光倒计时</div>
        </div>
        <div class="end-card hidden" id="endCard">
          <div class="eyebrow" id="endEyebrow">RACE OVER</div>
          <h2 id="endTitle">比赛结束</h2>
          <p id="endCopy"></p>
          <div class="podium hidden" id="podium"><img src="assets/podium.png" alt="F1像素风领奖台庆典" /></div>
          <button class="video-placeholder hidden" id="videoPlaceholder" type="button" aria-label="打开生日祝福视频">
            <span class="cinema-play" aria-hidden="true">▶</span>
            <span class="cinema-marquee">生日祝福时刻</span>
            <span class="cinema-caption">点击播放 · BIRTHDAY SPECIAL</span>
          </button>
          <button id="restartButton">再跑一圈 <span>↻</span></button>
          <div class="controls-hint">点击或按 Enter 重新开始</div>
        </div>
      </div>
      <div class="video-theater hidden" id="videoTheater" role="dialog" aria-modal="true" aria-label="生日祝福视频播放器">
        <button class="theater-close" id="theaterClose" type="button" aria-label="关闭视频">×</button>
        <div class="tv-frame">
          <div class="tv-topline"><span></span> BIRTHDAY GRAND PRIX <span></span></div>
          <div class="tv-screen">
            <video id="birthdayVideo" controls playsinline preload="auto"></video>
          </div>
          <div class="tv-controls"><span class="tv-led"></span><span>生日祝福时刻</span><span class="tv-knob"></span></div>
        </div>
      </div>
      <div class="speed-lines" aria-hidden="true"><span></span><span></span><span></span></div>
    </section>
    <footer><span>SCUDERIA PIXEL · 8-BIT RACING</span><span>© 2026</span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
